<section class="analysis-card ux-inspector-result" aria-label="Wynik UX Inspectora">
  <app-analysis-result-header
    [title]="report().header || 'UX Inspector result'"
    [context]="report().subHeader"
    [confidence]="resultMeta().confidence"
    [partialNotice]="status() === 'PARTIAL' ? 'Odpowiedź jest częściowa. Ograniczenia i brakujące dowody są wskazane pod wynikiem.' : ''"
    [shareDocument]="shareDocument()"
  />

  @if (report().markdownSummary) {
    <section class="ux-inspector-result__summary" aria-label="Podsumowanie odpowiedzi">
      <app-markdown-content [content]="report().markdownSummary" />
    </section>
  }

  @if (answerSection(); as answer) {
    <section class="ux-inspector-result__answer" aria-label="Odpowiedź UX Inspectora">
      <div class="ux-inspector-result__answer-heading">
        <span class="material-symbols-outlined" aria-hidden="true">task</span>
        <div>
          <span class="field-label">Odpowiedź</span>
          <h3>{{ answer.title || 'Odpowiedź' }}</h3>
        </div>
      </div>
      <app-analysis-report-section-content
        [markdown]="answer.markdown"
        emptyText="Brak bezpiecznie potwierdzonej odpowiedzi."
        [meta]="resultMeta()"
        metaAlign="end"
      />
    </section>
  }
</section>
