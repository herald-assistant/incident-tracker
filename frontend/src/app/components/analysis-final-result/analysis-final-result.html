@if (display(); as analysisResult) {
  <section class="final-analysis">
    <app-analysis-result-header
      [editable]="editable()"
      (editRequested)="editRequested.emit()"
      [title]="status() === 'COMPLETED' ? 'Finalna analiza' : 'Ostatnia dostępna analiza'"
      [context]="analysisResult.subTitle"
      [confidence]="analysisResult.confidence"
      [shareDocument]="shareDocument()"
    ></app-analysis-result-header>

    @if (hasMeaningfulValue(analysisResult.detectedProblem)) {
      <div class="analysis-highlights">
        <div class="analysis-highlight">
          <p class="result-card-label">Najbardziej prawdopodobny problem</p>
          <code class="problem-badge">{{ analysisResult.detectedProblem }}</code>
        </div>
      </div>
    }

    <app-analysis-result-tabs
      [tabs]="analysisResult.sections"
      [activeTabId]="activeAnalysisTab()"
      ariaLabel="Sekcje finalnej analizy"
      (tabSelected)="selectAnalysisTab($event)"
    >
      @for (section of analysisResult.sections; track section.id) {
        @if (activeAnalysisTab() === section.id) {
          <div class="analysis-result-tab-content">
            <app-analysis-report-section-content
              [markdown]="section.markdown"
              [emptyText]="section.emptyText"
              [meta]="section.meta"
              metaAlign="start"
            ></app-analysis-report-section-content>
          </div>
        }
      }
    </app-analysis-result-tabs>

    <section class="final-analysis__appendix" aria-label="Analysis appendix">
      <app-analysis-report-meta
        [meta]="analysisResult.appendix"
        variant="appendix"
      ></app-analysis-report-meta>
    </section>
  </section>
}
