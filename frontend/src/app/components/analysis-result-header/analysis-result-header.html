<div class="panel-card__header panel-card__header--compact analysis-result-header">
  <div>
    <p class="section-eyebrow">Wynik</p>
    <h3>{{ title() }}</h3>
    @if (hasMeaningfulValue(context())) {
      <p>{{ context() }}</p>
    }
  </div>

  <div class="analysis-result-header__actions">
    @if (hasMeaningfulValue(confidence())) {
      <div
        class="analysis-result-header__confidence"
        [attr.aria-label]="'Confidence: ' + confidence()"
      >
        <span class="result-card-label">Confidence</span>
        <code class="problem-badge analysis-result-header__confidence-value">
          {{ confidence() }}
        </code>
      </div>
    }

    @if (shareDocument(); as document) {
      <app-analysis-share-menu [document]="document" />
    }
  </div>
</div>
