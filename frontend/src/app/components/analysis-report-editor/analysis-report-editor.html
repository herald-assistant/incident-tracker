<section class="analysis-card analysis-report-editor" aria-label="Edycja raportu">
  <div class="analysis-report-editor__header">
    <div><p class="section-eyebrow">Wynik</p><h3>Edytuj raport</h3></div>
    <div class="analysis-report-editor__actions">
      <button type="button" class="secondary-button" (click)="cancel.emit()" [disabled]="saving()">Anuluj</button>
      <button type="button" class="secondary-button" (click)="preview.set(!preview())">{{ preview() ? 'Edytuj Markdown' : 'Podgląd' }}</button>
      <button type="button" class="primary-button" (click)="submit()" [disabled]="!canSave() || saving() || !report().revisionSha256">{{ saving() ? 'Zapisywanie…' : 'Zapisz zmiany' }}</button>
    </div>
  </div>
  @for (part of parts(); track part.id) {
    <section class="analysis-report-editor__part">
      @if (preview()) {
        <h4 class="analysis-report-editor__part-title">{{ part.title }}</h4>
        <div class="analysis-report-editor__preview">
          <app-markdown-content [content]="content(part)" />
        </div>
      } @else {
        <h4 class="analysis-report-editor__part-title" [id]="'report-edit-title-' + part.id">{{ part.title }}</h4>
        <app-markdown-source-editor [id]="'report-edit-' + part.id" [labelledBy]="'report-edit-title-' + part.id"
          [value]="content(part)" [disabled]="saving()" (valueChange)="update(part.id, $event)" />
      }
    </section>
  }
  @if (error()) { <p class="form-error" role="alert">{{ error() }}</p> }
</section>
