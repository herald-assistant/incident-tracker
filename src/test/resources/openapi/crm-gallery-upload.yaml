openapi: 3.1.0
info: {title: CRM gallery, version: '1'}
servers: [{url: 'http://127.0.0.1:8099'}]
paths:
  /gallery/{id}:
    put:
      operationId: replaceGallery
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cover, pages]
              properties:
                cover: {}
                pages: {type: array, items: {}, minItems: 1}
                approved: {type: boolean}
                revision: {type: integer}
                checksum: {type: string, readOnly: true}
            encoding:
              cover: {contentType: image/bmp}
      responses:
        '201': {description: Zapisano}
