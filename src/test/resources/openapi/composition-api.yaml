openapi: 3.1.0
info: {title: Fikcyjne warianty elementów, version: '1'}
servers: [{url: 'http://127.0.0.1:8099'}]
paths:
  /items/{batchId}:
    post:
      operationId: createItem
      x-tdw-operation-effect: MUTATION
      x-test-label: synthetic
      parameters:
        - {name: batchId, in: path, required: true, schema: {type: integer}}
        - {name: ownerKey, in: query, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/TimedForm'}
                - {$ref: '#/components/schemas/BasicForm'}
              discriminator:
                propertyName: type
                mapping: {TIMED: '#/components/schemas/TimedForm', BASIC: '#/components/schemas/BasicForm'}
      responses:
        '200': {description: Created, content: {application/json: {schema: {type: object, properties: {id: {type: integer}}}}}}
  /collections:
    get:
      operationId: getOrCreateCollection
      parameters:
        - {name: ownerKey, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Collection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {$ref: '#/components/schemas/Node'}
components:
  schemas:
    BaseItemForm:
      type: object
      required: [type, size, generatedId]
      properties:
        type: {type: string, enum: [TIMED, BASIC]}
        size: {type: number, minimum: 1}
        generatedId: {type: integer, readOnly: true}
        note: {type: [string, 'null']}
        labels: {type: array, uniqueItems: true, items: {type: string}}
        weights: {type: object, additionalProperties: {type: number, minimum: 0}}
    TimedForm:
      allOf:
        - {$ref: '#/components/schemas/BaseItemForm'}
        - type: object
          required: [duration]
          properties:
            type: {const: TIMED}
            duration: {type: integer, minimum: 1}
            size: {type: number, minimum: 0}
    BasicForm:
      allOf:
        - {$ref: '#/components/schemas/BaseItemForm'}
        - type: object
          properties:
            type: {const: BASIC}
    Node:
      type: object
      properties:
        next: {$ref: '#/components/schemas/Node'}
