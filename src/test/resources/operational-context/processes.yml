schemaVersion: 1

processes:
  - id: customer-support-process
    name: Customer Support Process
    purpose: Handles the customer support workflow.
    participants:
      primarySystems: [crm-customer-service]
      externalSystems: [crm-notification-provider]
    steps:
      - id: call-crm-notification-provider
        name: Call CRM Notification Provider
        references:
          systems: [crm-customer-service, crm-notification-provider]
        matchSignals:
          exact:
            hosts: [api.crm-notifications.example.invalid]
    processBoundary:
      endsWhen: [customer-support-process-completed]
gaps: []
