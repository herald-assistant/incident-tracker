schemaVersion: 1

repositories:
  - id: crm-contact-service-repo
    name: CRM Contact Service Repository
    git:
      provider: gitlab
      group: synthetic/crm
      project: crm-contact-service-repo
      projectPath: synthetic/crm/crm-contact-service-repo
    references:
      systems: [crm-contact-service]
      processes: [crm-contact-notification-flow]
      boundedContexts: [crm-contact-context]
      teams: [crm-contact-team]
    matchSignals:
      exact:
        projectNames: [crm-contact-service-repo]
      strong: {}
  - id: crm-contact-rules-repo
    name: CRM Contact Rules Library
    git:
      provider: gitlab
      group: synthetic/crm
      project: libs/crm-contact-rules
      projectPath: synthetic/crm/libs/crm-contact-rules
    references:
      systems: [crm-contact-service]
      processes: [crm-contact-notification-flow]
      boundedContexts: [crm-contact-context]
      teams: [crm-contact-team]
    matchSignals:
      exact:
        projectNames: [crm-contact-rules]
gaps: []
