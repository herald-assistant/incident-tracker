schemaVersion: 1

systems:
  - id: crm-contact-service
    name: CRM Contact Service
    systemType: internal-service
    systemSubtype: backend
    purpose: Maintains synthetic CRM contact profiles and notification requests.
    references:
      repositories: [crm-contact-service-repo, crm-contact-rules-repo]
      processes: [crm-contact-notification-flow]
      boundedContexts: [crm-contact-context]
      teams: [crm-contact-team]
    ownership:
      ownerTeamIds: [crm-contact-team]
      ownershipStatus: explicit
      confidence: high
      source: test
    matchSignals:
      strong:
        projectNames: [crm-contact-service-repo, crm-contact-rules]
        spans: [CrmNotificationGateway.call]
        markers: [CRM_CONTACT]
  - id: crm-notification-provider
    name: CRM Notification Provider
    systemType: external-system
    purpose: Simulates the external CRM notification API.
    references:
      processes: [crm-contact-notification-flow]
      boundedContexts: [crm-notification-context]
      teams: [crm-integration-team]
    ownership:
      ownerTeamIds: [crm-integration-team]
      ownershipStatus: explicit
      confidence: medium
      source: test
    matchSignals:
      exact:
        hosts: [api.crm-notification.example.invalid]
      strong:
        markers: [CRM_NOTIFICATION]
gaps: []
