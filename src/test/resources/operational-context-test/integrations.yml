schemaVersion: 1

integrations:
  - id: crm-contact-to-notification-sync
    name: CRM Contact Service to CRM Notification Provider
    summary: CRM Contact Service calls CRM Notification Provider synchronously.
    category: external-service-call
    integrationStyle: synchronous-request
    flowDirection: outbound
    participants:
      source:
        system: crm-contact-service
      targets:
        - system: crm-notification-provider
      finalTargets:
        - system: crm-notification-provider
          role: server
    references:
      processes: [crm-contact-notification-flow]
      boundedContexts: [crm-contact-context, crm-notification-context]
      teams: [crm-integration-team]
    matchSignals:
      exact:
        hosts: [api.crm-notification.example.invalid]
      strong:
        spans: [CrmNotificationGateway.call]
        markers: [CRM_NOTIFICATION]
        errors: [SOAPFault, Read timed out]
gaps: []
