schemaVersion: 1
catalogKind: operational-context-code-search-scopes

codeSearchScopes:
  - id: crm-contact-code-search
    name: CRM Contact Service Code Search Scope
    scopeType: system
    lifecycleStatus: active
    summary: Repository scope for the synthetic CRM contact service.
    target:
      type: system
      id: crm-contact-service
    useFor: [code-search, incident-analysis]
    repositories:
      - repoId: crm-contact-service-repo
        role: primary
        priority: 1
        searchMode: path-prefixes
        pathPrefixes:
          - modules/crm-contact-service
          - shared/crm-contact-rules
        reason: Primary repository for synthetic CRM contact handling.
        readFor: [business-flow, core-behavior]
      - repoId: crm-contact-rules-repo
        role: supporting-library
        priority: 2
        searchMode: whole-repository
        reason: Shared CRM contact rules are used by crm-contact-service.
        readFor: [shared-rules]

gaps: []
