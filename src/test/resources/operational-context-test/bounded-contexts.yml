schemaVersion: 1

boundedContexts:
  - id: crm-contact-context
    name: CRM Contact Context
    category: supporting-domain
    purpose: Owns synthetic CRM contact profile rules.
    references:
      systems: [crm-contact-service]
      repositories: [crm-contact-service-repo]
      processes: [crm-contact-notification-flow]
      integrations: [crm-contact-to-notification-sync]
      terms: [crm-contact]
      teams: [crm-contact-team]
    ownership:
      ownerTeamIds: [crm-contact-team]
      ownershipStatus: explicit
      confidence: high
      source: test
    matchSignals:
      strong:
        markers: [CRM_CONTACT]
    relations:
      - target: crm-notification-context
        type: conformist
        via: [crm-contact-to-notification-sync]
gaps:
  - id: confirm-crm-contact-context-boundary
    type: human-confirmation-required
    severity: medium
    status: open
    entityType: bounded-context
    entityId: crm-contact-context
    description: Confirm whether CRM Contact Context should include shared CRM contact rules.
