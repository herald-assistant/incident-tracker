schemaVersion: 1

processes:
  - id: crm-contact-notification-flow
    name: CRM Contact Notification Flow
    purpose: Routes a synthetic CRM contact update to the notification provider.
    participants:
      primarySystems: [crm-contact-service]
      externalSystems: [crm-notification-provider]
    references:
      repositories: [crm-contact-service-repo]
      boundedContexts: [crm-contact-context]
      integrations: [crm-contact-to-notification-sync]
      teams: [crm-contact-team, crm-integration-team]
    processSteps:
      - id: call-crm-notification-provider
        name: Call CRM Notification Provider
        participants:
          systems: [crm-contact-service, crm-notification-provider]
        matchSignals:
          exact:
            hosts: [api.crm-notification.example.invalid]
    processBoundary:
      endsWhen: [crm-contact-notification-flow-completed]
gaps: []
