<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TDW Browser Companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-header">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>
          <strong>TDW Companion</strong>
          <small>Browser capabilities</small>
        </span>
      </header>

      <section class="page-card" aria-labelledby="current-page-title">
        <span class="eyebrow">Biezaca strona</span>
        <h1 id="current-page-title">Sprawdzanie strony…</h1>
        <p id="current-origin">Poczekaj chwile.</p>
        <div id="page-status" class="status-pill" role="status">Ladowanie</div>
      </section>

      <section aria-labelledby="features-title">
        <div class="section-heading">
          <div>
            <span class="eyebrow">Funkcje</span>
            <h2 id="features-title">Dostepne na originie</h2>
          </div>
          <span class="demo-badge">Starter</span>
        </div>
        <div id="feature-list" class="feature-list"></div>
      </section>

      <div id="feedback" class="feedback hidden" role="alert"></div>

      <footer>
        <button id="open-options" class="text-button" type="button">Ustawienia rozszerzenia</button>
        <span>v<span id="extension-version"></span></span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
